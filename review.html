<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review · Planet Zorgon</title>
  <meta name="description" content="A review from Planet Zorgon: movies, games and comics I like.">
  <meta name="theme-color" content="#2846b8">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/shrikhand.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="is-review">

<!-- Icon set (drawn once, reused everywhere) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-planet" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="6.5" fill="currentColor"/>
      <ellipse cx="12" cy="12" rx="11" ry="3.6" fill="none" stroke="currentColor" stroke-width="1.8" transform="rotate(-20 12 12)"/>
    </symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24">
      <path d="M7 17.5h10.2a4 4 0 0 0 .5-7.97A5.5 5.5 0 0 0 7.1 8.6 4.5 4.5 0 0 0 7 17.5Z" fill="currentColor"/>
      <path d="M8.5 19.8l-.8 2M12.5 19.8l-.8 2M16.5 19.8l-.8 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-close" viewBox="0 0 24 24">
      <path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24">
      <path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-spark" viewBox="0 0 24 24">
      <path d="M12 0c.8 6.4 4.4 10.6 12 12-7.6 1.4-11.2 5.6-12 12-.8-6.4-4.4-10.6-12-12 7.6-1.4 11.2-5.6 12-12Z" fill="currentColor"/>
    </symbol>
  </defs>
</svg>

<a class="skip" href="#review">Skip to the review</a>

<header class="bar is-scrolled" id="bar">
  <a class="bar__home" href="index.html#top" aria-label="Planet Zorgon home">
    <svg class="bar__logo" aria-hidden="true"><use href="#i-planet"/></svg>
    <span data-site-name>Planet Zorgon</span>
  </a>
  <nav class="bar__nav" aria-label="Sections">
    <a href="index.html#about">About</a>
    <a href="index.html#like" aria-current="true">Shit I Like</a>
    <a href="index.html#miseries">Daily Miseries</a>
  </nav>
</header>

<main id="main">
  <section class="rv-hero" id="rv-hero">
    <div class="rv-hero__copy">
      <a class="rv-back" id="rv-back" href="index.html#like">
        <svg class="flip" aria-hidden="true"><use href="#i-arrow"/></svg><span>Back to Shit I Like</span>
      </a>
      <h1 class="rv-title" id="rv-title"></h1>
      <div class="rv-meta" id="rv-meta"></div>
      <blockquote class="bubble" id="rv-verdict"></blockquote>
    </div>
    <figure class="rv-planet" aria-hidden="true">
      <svg viewBox="0 0 600 600" class="planet" id="rv-planet-svg"></svg>
      <figcaption id="rv-planet-cap"></figcaption>
    </figure>
  </section>

  <section class="rv-body" id="review" aria-labelledby="rv-review-h">
    <div class="rv-body__inner">
      <div class="rv-cover">
        <div class="ink ink--blue rv-cover__img" id="rv-cover"></div>
        <p class="rv-cover__hint"><span class="hint-hover">Hover to see the real colours</span><span class="hint-tap">Tap to see the real colours</span></p>
      </div>
      <article class="sheet rv-sheet">
        <h2 class="rv-sheet__h" id="rv-review-h">The review</h2>
        <div class="prose" id="rv-text"></div>
        <dl class="rv-credits" id="rv-credits" hidden></dl>
      </article>
    </div>
  </section>

  <section class="rv-more" id="rv-more" aria-labelledby="rv-more-h">
    <h2 class="display" id="rv-more-h"></h2>
    <div class="shelf" id="rv-more-list"></div>
  </section>
</main>

<footer class="foot">
  <svg class="foot__planet" viewBox="0 0 600 200" aria-hidden="true">
    <circle cx="300" cy="230" r="170" fill="#ff4fa3"/>
    <ellipse cx="300" cy="190" rx="270" ry="40" fill="none" stroke="#ffd23f" stroke-width="16" transform="rotate(-6 300 190)"/>
  </svg>
  <p class="foot__end">End of transmission.</p>
  <p class="foot__small"><span data-site-name>Planet Zorgon</span> · written by its only inhabitant · <a href="index.html#top">Back to orbit</a></p>
</footer>

<div class="oops" id="oops" role="alert" hidden></div>
